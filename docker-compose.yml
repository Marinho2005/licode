services:
  sandbox:
    build:
      context: .
      dockerfile: apps/sandbox/Dockerfile
      args:
        VITE_ALLOWED_PARENT_ORIGINS: "http://localhost:${WEB_PORT:-8080}"
    ports:
      - "${SANDBOX_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_SANDBOX_URL: "${PUBLIC_SANDBOX_URL:-http://localhost:${SANDBOX_PORT:-8081}}"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
